<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0d10">
  <title>CHAOS.COLLAGE</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0c0e'/%3E%3Crect x='6' y='11' width='13' height='15' rx='2.5' fill='none' stroke='%238b8b93' stroke-width='1.6'/%3E%3Crect x='12.5' y='6' width='13' height='15' rx='2.5' fill='%23d7ff2f' transform='rotate(8 19 13.5)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home-open no-doc">
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="homeButton" title="工程主页">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="5" y="10" width="15.5" height="17.5" rx="3" fill="none" stroke="#8b8b93" stroke-width="1.7"/>
          <rect x="11.5" y="4.5" width="15.5" height="17.5" rx="3" fill="#d7ff2f" transform="rotate(8 19.25 13.25)"/>
        </svg>
        <span class="brand-text"><strong>CHAOS.COLLAGE</strong></span>
      </button>

      <nav class="menubar" id="menubar" aria-label="菜单">
        <button class="menu-trigger" data-menu-trigger="file">文件</button>
        <button class="menu-trigger" data-menu-trigger="edit">编辑</button>
        <button class="menu-trigger" data-menu-trigger="image">图像</button>
        <button class="menu-trigger" data-menu-trigger="layer">图层</button>
        <button class="menu-trigger" data-menu-trigger="view">视图</button>
        <button class="menu-trigger" data-menu-trigger="help">帮助</button>
      </nav>

      <div class="doc-title">
        <input class="doc-name" id="docName" type="text" spellcheck="false" aria-label="工程名" title="工程名（点击修改）">
        <span class="save-state" id="saveState"></span>
      </div>

      <div class="top-actions" role="toolbar" aria-label="主要操作">
        <button class="ui-button icon-only" id="undoButton" data-icon="undo" title="撤销 (Ctrl+Z)" aria-label="撤销"></button>
        <button class="ui-button icon-only" id="redoButton" data-icon="redo" title="重做 (Ctrl+Shift+Z)" aria-label="重做"></button>
        <span class="toolbar-separator"></span>
        <button class="ui-button primary" id="exportButton" title="导出图片 (Ctrl+E)"><span data-icon="export" class="inline-icon"></span><span>导出</span></button>
      </div>
    </header>

    <main class="main-grid">
      <nav class="toolrail" id="toolrail" aria-label="工具栏"></nav>

      <aside class="left-panel panel">
        <nav class="panel-tabs" aria-label="左侧面板">
          <button class="tab-button active" data-tab="layers">图层</button>
          <button class="tab-button" data-tab="resources">资源</button>
          <button class="tab-button" data-tab="history">历史</button>
        </nav>

        <section class="tab-panel active" data-panel="layers">
          <div class="panel-heading">
            <span>图层</span>
            <span class="heading-actions">
              <button class="icon-button icon-only" id="layerAddButton" data-icon="plus" title="新建图层" aria-label="新建图层"></button>
              <button class="icon-button icon-only" id="layerDuplicateButton" data-icon="duplicate" title="复制图层 (Ctrl+D)" aria-label="复制图层"></button>
              <button class="icon-button icon-only" id="layerDeleteButton" data-icon="trash" title="删除图层 (Delete)" aria-label="删除图层"></button>
            </span>
          </div>
          <div id="layersList" class="layers-list" aria-label="图层列表"></div>
        </section>

        <section class="tab-panel" data-panel="resources" id="resourcesPanel">
          <div class="panel-heading">
            <span>工程图片</span>
            <button class="icon-button" data-res-action="import-image">导入</button>
          </div>
          <div class="asset-grid" data-res-images></div>
          <div class="panel-heading spaced">
            <span>字体库</span>
            <button class="icon-button" data-res-action="import-font">导入</button>
          </div>
          <div class="font-list" data-res-fonts></div>
          <div class="local-fonts">
            <button class="mini-button wide" data-res-action="local-fonts">读取本机全部字体</button>
            <small data-local-count></small>
          </div>
        </section>

        <section class="tab-panel" data-panel="history" id="historyPanel">
          <div class="panel-heading"><span>历史记录</span></div>
          <div id="historyList" class="history-list"></div>
        </section>
      </aside>

      <section class="workspace" id="workspace">
        <div class="options-bar" id="optionsBar">
          <div class="options-left"></div>
          <div class="zoom-controls">
            <button class="icon-button icon-only" id="zoomOut" data-icon="minus" title="缩小 (Ctrl+-)" aria-label="缩小"></button>
            <button class="zoom-value" id="zoomValue" title="缩放">100%</button>
            <button class="icon-button icon-only" id="zoomIn" data-icon="plus" title="放大 (Ctrl+=)" aria-label="放大"></button>
            <button class="icon-button" id="zoomFit" title="适应窗口 (Ctrl+0)">适应</button>
          </div>
        </div>

        <div class="viewport" id="viewport" tabindex="-1">
          <canvas id="artCanvas" class="art-canvas" aria-label="画布"></canvas>
          <canvas id="overlayCanvas" class="overlay-canvas" aria-hidden="true"></canvas>
          <textarea id="textEditor" class="inline-text-editor" spellcheck="false" hidden></textarea>
          <div class="drop-overlay" id="dropOverlay">
            <strong>拖放到这里</strong>
            <span>图片会添加为新图层 · .chaos 工程文件会被打开 · 字体文件会导入字体库</span>
          </div>
        </div>
        <div class="flyout" id="flyout" hidden></div>

        <div class="statusbar">
          <div class="status-left"><span class="status-dot"></span><span id="statusText">就绪</span></div>
          <div class="status-pos" id="statusPos"></div>
          <div class="status-right"><span id="statusDoc"></span><span>种子 <button class="seed-button" id="seedButton" title="换随机种子">—</button></span></div>
        </div>
      </section>

      <aside class="right-panel panel">
        <div class="panel-heading inspector-title">
          <span>属性</span>
          <span id="inspectorBadge" class="type-badge">—</span>
        </div>
        <div id="inspector" class="inspector"></div>
      </aside>
    </main>
  </div>

  <div class="home" id="home"></div>
  <div id="modalRoot"></div>

  <input id="imageInput" type="file" accept="image/*" multiple hidden>
  <input id="projectInput" type="file" accept=".chaos,.json,application/json" hidden>
  <input id="fontInput" type="file" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2" multiple hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/util.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/fonts.js"></script>
  <script src="js/warp.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/effects-glitch.js"></script>
  <script src="js/shatter.js"></script>
  <script src="js/vector-assets.js"></script>
  <script src="js/generators.js"></script>
  <script src="js/text.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/model.js"></script>
  <script src="js/app-core.js"></script>
  <script src="js/app-tools.js"></script>
  <script src="js/app-panels.js"></script>
  <script src="js/app-dialogs.js"></script>
  <script src="app.js"></script>
</body>
</html>
